# Same-scheduler control for the Renoise+Microsteps targeted rescue probe.

model:
  name: wan22_ti2v_5b_euler_worst10
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda
  scheduler: euler

generation:
  resolution: [480, 832]
  num_frames: 81
  num_inference_steps: 50
  guidance_scale: 5.0

prompts:
  source: ttsd.prompts.worst10:WORST10_BASE_NO_DYNAMIC6_PROMPTS

seeds:
  count: 1
  base: 0

snapshots:
  every_n_steps: 5
  also_keep: [19]
  posterior_means: false
  capture_raw_latents: false

output:
  root: runs/baseline
  run_id: worst10_euler_control_001
  save_video: true
  save_latents: true
