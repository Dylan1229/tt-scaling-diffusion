# Prompt-dependency baseline set for late-stage branching.

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda
  scheduler: unipc

generation:
  resolution: [480, 832]
  num_frames: 81
  num_inference_steps: 50
  guidance_scale: 5.0

prompts:
  source: ttsd.prompts.prompt_dependency_v1:PROMPT_DEPENDENCY_V1_PROMPTS

seeds:
  count: 3
  base: 0

snapshots:
  every_n_steps: 5
  also_keep: [1, 49]
  posterior_means: false
  capture_raw_latents: false

output:
  root: runs/baseline
  run_id: null
  save_video: true
  save_latents: false
  save_meta: true
