# Binary chunk-branch I2V run for all dev prompts with root seeds 0,1.
# Chunk 0 is fixed; chunks 1-5 branch into 32 leaf paths per root.

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda
  scheduler: unipc

generation:
  mode: last_frame_i2v_chunks
  resolution: [480, 832]
  target_num_frames: 481
  chunk_num_frames: 81
  num_chunks: 6
  overlap_frames: 1
  fps: 16
  num_inference_steps: 50
  guidance_scale: 5.0
  chunk_seed_stride: 1000000

branch:
  prompt_ids: [p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12, p13, p14, p15]
  root_seeds: [0, 1]
  branch_factor: 2
  branch_chunks: [1, 2, 3, 4, 5]
  seed_index_stride: 1000

prompts:
  source: ttsd.prompts.dev_set:DEV_PROMPTS

output:
  root: runs/baseline_long
  run_id: null
