# Last-frame I2V continuation baseline for VBench-Long.
# Chunk 0 is T2V; chunks 1-5 are I2V from the previous chunk's last frame.

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda
  scheduler: unipc

generation:
  mode: last_frame_i2v_chunks
  resolution: [480, 832]
  target_num_frames: 481
  chunk_num_frames: 81
  num_chunks: 6
  overlap_frames: 1
  fps: 16
  num_inference_steps: 50
  guidance_scale: 5.0
  chunk_seed_stride: 1000000

prompts:
  source: ttsd.prompts.dev_set:DEV_PROMPTS

seeds:
  count: 10
  base: 0

output:
  root: runs/baseline_long
  run_id: null
  save_video: true
  save_chunks: false
  save_meta: true
