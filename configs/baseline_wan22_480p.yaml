# Phase 0 baseline — seed-sensitivity probe.
# Goal: show that VBench scores have non-trivial seed-to-seed variance
# on Wan 2.2 5B → motivates everything downstream.

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda

generation:
  resolution: [480, 832]   # H, W — Wan 2.2 480p default
  num_frames: 81
  num_inference_steps: 50
  guidance_scale: 5.0

prompts:
  source: ttsd.prompts.dev_set:DEV_PROMPTS
  # Use all 15. Override here to subset during smoke tests.

seeds:
  count: 10                 # full Phase 0 run
  base: 0                   # seeds will be base + [0..count-1]

snapshots:
  # Persist latents every 5 steps for the Phase 1 verifier dataset.
  # Cheap: 50/5 = 10 snapshots × ~tens of MB each.
  every_n_steps: 5
  also_keep: [1, 49]        # keep first and last too

output:
  root: runs/baseline
  run_id: null              # null → autogenerated from timestamp
  save_video: true
  save_latents: true
  save_meta: true
