# Saturation check on a prompt-stratified 45-root subset.

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda
  scheduler: unipc

generation:
  resolution: [480, 832]
  num_frames: 81
  num_inference_steps: 50
  guidance_scale: 5.0

late_branching:
  branch_step: 35
  # Sixteen noisy candidates plus a batched, unperturbed diagnostic control.
  num_noise_branches: 16
  include_batched_control: true
  perturbation_scale: 0.10
  noise_seed_offset: 10000000
  noise_seed_stride: 1000
  posterior_mean_offsets: [1, 3, 5]
  decode_batch_size: 8

prompts:
  source: ttsd.prompts.dev_set:DEV_PROMPTS

seeds:
  count: 10
  base: 0

output:
  root: runs/late_branching
  run_id: null
  save_video: true
  fps: 16
  candidate_seed_stride: 100
