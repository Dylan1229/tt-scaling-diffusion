# Sweep v2 (2026-05-20) — 30 prompts × variable seeds = 450 clips total.
#   Group A: original 15 prompts × seeds 10-19 (10 clips each = 150)
#   Group B: 15 NEW prompts × seeds 0-19 (20 clips each = 300)
# All clips capture posterior means (x0_hat) inline.
# Sized for ~2.5 h on 4 Blackwell GPUs (sharded).

model:
  name: wan22_ti2v_5b
  path: /data/datasets/fanjiang/.cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
  dtype: bf16
  device: cuda                # CUDA_VISIBLE_DEVICES picks the physical GPU per shard
  # Sampler family. Options:
  #   unipc     - deterministic ODE, 2nd-order multistep (Wan 2.2 bundled default)
  #   euler     - deterministic ODE, 1st-order Euler (same-family ablation control)
  #   euler_sde - SDE: Euler step + ancestral noise injection at every step
  # `flow_shift` from the bundled scheduler config is preserved across kinds.
  scheduler: unipc

generation:
  resolution: [480, 832]      # H, W — Wan 2.2 480p default
  num_frames: 81
  num_inference_steps: 50
  guidance_scale: 5.0

prompts:
  source: ttsd.prompts.sweep_v2:SWEEP_V2_PROMPTS
  # Each entry carries its own `seeds` list → the runner uses those and
  # ignores the global `seeds.*` block below.

seeds:
  count: 1                    # ignored when prompts carry per-entry `seeds`
  base: 0

snapshots:
  every_n_steps: 5
  also_keep: [1, 49]
  posterior_means: true       # ON by default for this sweep

output:
  root: runs/baseline
  run_id: null                # autogenerated; CLI --run-id overrides (used by 4-GPU launch script)
  save_video: true
  save_latents: true
  save_meta: true
